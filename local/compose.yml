# Local test of the Railway template (not used by Railway). Run from the repo root:
#   docker compose -f local/compose.yml up -d --build
name: her-2685
x-ds-env: &ds-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dolphinscheduler
  SPRING_DATASOURCE_USERNAME: dolphin
  SPRING_DATASOURCE_PASSWORD: localtestpw
  REGISTRY_ZOOKEEPER_CONNECT_STRING: zookeeper:2181
  AWS_S3_ENDPOINT: http://minio:9000
  AWS_S3_REGION: us-east-1
  AWS_S3_BUCKET_NAME: dolphinscheduler
  AWS_S3_ACCESS_KEY_ID: localaccess
  AWS_S3_ACCESS_KEY_SECRET: localsecret123
  DS_HEAP: 384m
services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: dolphin, POSTGRES_PASSWORD: localtestpw, POSTGRES_DB: dolphinscheduler}
    volumes: [pg:/var/lib/postgresql/data]
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment: {MINIO_ROOT_USER: localaccess, MINIO_ROOT_PASSWORD: localsecret123, MINIO_DEFAULT_BUCKETS: dolphinscheduler}
    volumes: [minio:/bitnami/minio/data]
  zookeeper:
    build: ../zookeeper
    environment: {PORT: "8080"}
    volumes: [zk:/data]
  api:
    build: ../api
    environment: {<<: *ds-env, PORT: "8080", ADMIN_PASSWORD: LocalAdminPw42}
    ports: ["18080:8080"]
  master:
    build: ../master
    environment: *ds-env
  worker:
    build: ../worker
    environment: *ds-env
    volumes: [worker:/data]
  alert-server:
    build: ../alert-server
    environment: {<<: *ds-env, DS_HEAP: 256m}
volumes: {pg: {}, minio: {}, zk: {}, worker: {}}
